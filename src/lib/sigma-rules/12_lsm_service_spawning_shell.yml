title: LSM server process is executing a shell
id: lsm_service_spawning_shell
logsource:
    product: linux
    category: lsm
detection:
    selection:
        Image:
            - "nginx"
            - "apache2"
            - "httpd"
            - "mysqld"
            - "postgres"
            - "redis-server"
            - "sshd"
        TargetFilename:
            - "/bin/sh"
            - "/bin/bash"
            - "/bin/dash"
            - "/usr/bin/sh"
            - "/usr/bin/bash"
    condition: selection
