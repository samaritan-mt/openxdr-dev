- id: "suspicious_sudo"
  description: "Detect sudo by non-admin users"
  severity: high
  os: linux
  match:
    event_type: "EXECVE"
    process_name: "sudo"
    user_not_in: ["root"]
  actions:
    - type: "alert_json"
      destination: "stdout"
- id: "unauthorized_file_modification"
  description: "Detect edits to protected system files by non-root users"
  severity: high
  os: linux
  match:
    event_type: "SYSCALL"
    syscall: ["open", "openat", "write"]
    file_path_in:
      - "/etc/passwd"
      - "/etc/shadow"
      - "/etc/sudoers"
    user_not_in: ["root"]
  actions:
    - type: "alert_json"
      destination: "stdout"

- id: "unexpected_binary_exec"
  description: "Non-root user executing binaries in /usr/sbin or /sbin"
  severity: medium
  os: linux
  match:
    event_type: "EXECVE"
    process_path_prefix_in:
      - "/usr/sbin/"
      - "/sbin/"
    user_not_in: ["root"]
  actions:
    - type: "alert_json"
      destination: "stdout"


- id: "netcat_or_reverse_shell"
  description: "Detect common reverse-shell tools"
  severity: high
  os: linux
  match:
    event_type: "EXECVE"
    process_name_in: ["nc", "ncat", "netcat", "bash"]
    args_regex: ".*(\\-e|\\-c|/dev/tcp/).*"
  actions:
    - type: "alert_json"
      destination: "stdout"

- id: "kernel_module_injection"
  description: "Monitor for attempts to load kernel modules"
  severity: critical
  os: linux
  match:
    event_type: "SYSCALL"
    syscall: ["init_module", "finit_module"]
  actions:
    - type: "alert_json"
      destination: "stdout"

- id: "unexpected_network_tool_usage"
  description: "Detect use of network scanning tools"
  severity: high
  os: linux
  match:
    event_type: "EXECVE"
    process_name_in: ["nmap", "masscan", "zmap"]
  actions:
    - type: "alert_json"
      destination: "stdout"

- id: "privilege_escalation_attempt"
  description: "Detect calls to setuid binaries by non-root users"
  severity: high
  os: linux
  match:
    event_type: "EXECVE"
    file_has_setuid_bit: true
    user_not_in: ["root"]
  actions:
    - type: "alert_json"
      destination: "stdout"

- id: "config_file_tampering"
  description: "Changes to SSH config"
  severity: medium
  os: linux
  match:
    event_type: "SYSCALL"
    syscall_in: ["open", "write", "openat"]
    file_path_in:
      - "/etc/ssh/sshd_config"
      - "/etc/ssh/ssh_config"
  actions:
    - type: "alert_json"
      destination: "stdout"

- id: "unauthorized_cron_modification"
  description: "Detect modifications to cron jobs by non-root users"
  severity: medium
  os: linux
  match:  
    event_type: "SYSCALL"
    syscall_in: ["open", "write", "openat"]
    file_path_regex: "^/var/spool/cron/|^/etc/cron\\..*|^/etc/crontab$"
    user_not_in: ["root"]
  actions:
    - type: "alert_json"
      destination: "stdout"   

- id: "suspicious_launchctl_usage"
  description: "Detect use of launchctl by non-admin users"
  severity: medium
  os: macos
  match:
    event_type: "EXECVE"
    process_name: "launchctl"
    user_not_in: ["root", "admin"]
  actions:
    - type: "alert_json"
      destination: "stdout"