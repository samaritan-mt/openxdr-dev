[package]
name = "openxdr-agent"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "src/openxdr-common",
    "src/openxdr-ebpf",
    "src/agent-ebpf",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
aya = { version = "0.13.1", features = ["async_tokio"] }
serde_json = "1"
futures = "0.3"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
pnet = "0.35.0"
openxdr-common = { path = "src/openxdr-common" }
bytes = "1"
anyhow = "1"
agent-ebpf = { path = "src/agent-ebpf" }

[workspace.dependencies]
aya = "0.13.1"
aya-ebpf = "0.1.1"
aya-log-ebpf = "0.1.0"
openxdr-common = { path = "src/openxdr-common" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
bytes = "1"
