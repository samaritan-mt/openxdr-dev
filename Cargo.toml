[package]
name = "openxdr-agent"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "src/openxdr-common",
    "src/openxdr-ebpf",
    "src/agent-ebpf", "src/scratch",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
pnet = "0.35.0"
bytes = "1"
anyhow = "1"
regex = "1"
null-sigma = { version = "0.1.3", features = ["json"] }
syslog = "7.0.0"
[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true }
agent-ebpf = { path = "src/agent-ebpf" }
aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }

[dependencies.openxdr-common]
path = "src/openxdr-common"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
bytes = "1"
aya = { version = "0.13.1", features = ["async_tokio"] }
aya-ebpf = "0.2.1"
aya-log-ebpf = "0.1.0"



